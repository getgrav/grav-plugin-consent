      'BANNER_BODY': 'Texto del cuerpo'
      'LABEL_ACCEPT': 'Botón de aceptar'
      'LABEL_REJECT': 'Botón de rechazar'
      'LABEL_REJECT_HELP': 'Puedes cambiarle el nombre y su ubicación, pero siempre se muestra con el mismo peso visual que Aceptar. Dificultar el rechazo más que la aceptación es exactamente lo que la CNIL sancionó a Google y a Meta por hacer.'
