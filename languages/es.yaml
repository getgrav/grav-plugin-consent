# Cadenas del plugin Consent.
#
# Dos bloques, mismo contenido, a propósito:
#
# PLUGIN_CONSENT es la clave que busca el traductor del núcleo de Grav,
# así que es lo que lee el banner del frontend.
# ICU.PLUGIN_CONSENT es lo que comprueban primero Admin Next y el plugin API,
# ya que usan el espacio de nombres ICU, así que es de donde se resuelven las
# etiquetas de los blueprints.
#
# GENERADO — edita el diccionario de origen, no este archivo, si vas a
# regenerarlo.
# Traductores: copiad este archivo como <idioma>.yaml y traducid los valores
# en ambos bloques. Las claves deben permanecer idénticas.
'PLUGIN_CONSENT':
  'TITLE': 'Consentimiento'
  'DESCRIPTION': 'Consentimiento de cookies con un inventario en tiempo de ejecución en el que se registran otros plugins'
  'TAB':
    'GENERAL': 'General'
    'APPEARANCE': 'Apariencia'
    'CONTENT': 'Contenido'
    'CATEGORIES': 'Categorías'
    'SERVICES': 'Servicios'
    'INVENTORY': 'Inventario'
    'AUTOBLOCK': 'Bloqueo automático'
    'CONSENT_MODE': 'Modo de consentimiento'
    'LOG': 'Registro de consentimiento'
    'ADVANCED': 'Avanzado'
  'SECTION':
    'COOKIE': 'La cookie de consentimiento'
    'GEO': 'A quién se le pregunta'
    'TOKENS': 'Colores y tipografía'
    'TOKENS_TEXT': 'Deja estos campos en blanco y el banner heredará la fuente de tu tema y usará una paleta neutra que funciona en modo claro y oscuro. Cualquier valor que definas aquí sobrescribe la propiedad personalizada <code>--consent-*</code> correspondiente, y la hoja de estilos de tu tema sigue teniendo prioridad sobre ambos.'
    'CONTENT': 'Textos del banner'
    'CONTENT_TEXT': 'Cada campo aquí pasa por el traductor de Grav. Escribe texto plano y se mostrará tal cual; escribe una clave de traducción como <code>MYSITE.COOKIE_TITLE</code> y se resolverá desde <code>user/languages/</code>. Si dejas un campo vacío, se usará la traducción propia de este plugin en el idioma en el que esté navegando el visitante.'
    'CATEGORIES': 'Categorías de consentimiento'
    'CATEGORIES_TEXT': 'Los grupos que el visitante puede activar o desactivar. Déjalo vacío para usar los cuatro predeterminados: necesarias, funcionales, analíticas y marketing. Añade filas aquí solo si quieres renombrarlas, reordenarlas o crear las tuyas propias.'
    'SERVICES': 'Servicios que declaras tú mismo'
    'SERVICES_TEXT': 'Solo para elementos que ningún plugin conoce, como un script que hayas pegado en tu tema. Todo lo que registre un plugin aparece automáticamente en la pestaña Inventario, así que nunca tendrás que listarlo aquí.'
    'AUTOBLOCK': 'Bloqueo automático'
    'AUTOBLOCK_TEXT': 'Detecta scripts, contenidos incrustados y píxeles de seguimiento de terceros conocidos en la página final y los retiene hasta que se concede la categoría correspondiente. Útil cuando un fragmento de código se pega en una plantilla y no hay nada a lo que engancharse. Stripe, PayPal, reCAPTCHA y Turnstile se tratan como estrictamente necesarios, para que un pago o un captcha nunca dejen de funcionar.'
    'CONSENT_MODE': 'Google Consent Mode v2'
    'CONSENT_MODE_TEXT': 'Informa a las etiquetas de Google de lo que ha permitido el visitante. En la práctica, es obligatorio si diriges anuncios de Google al EEE. La señal de denegación predeterminada se escribe antes de que se cargue cualquier etiqueta de Google, y se actualiza en el momento en que el visitante toma una decisión.'
    'LOG': 'Prueba de consentimiento'
    'LOG_TEXT': 'El artículo 7 del RGPD exige poder demostrar que se dio el consentimiento. Cada decisión se añade a un archivo JSONL mensual en <code>user/data/consent/</code>. La dirección IP y el navegador del visitante se aplican con hash mediante un salt específico del sitio, y nunca se guardan tal cual.'
  'FIELD':
    'POLICY_VERSION': 'Versión de la política'
    'POLICY_VERSION_HELP': 'Aumenta este número para volver a preguntar a todo el mundo, por ejemplo tras un cambio en tu política de privacidad.'
    'AUTO_VERSION': 'Volver a preguntar cuando cambie el inventario'
    'AUTO_VERSION_HELP': 'Incorpora un hash de los identificadores de tus categorías y servicios a la versión, de modo que instalar un plugin que almacene algo nuevo pregunte de nuevo a todo el mundo automáticamente. Solo cuentan los identificadores, así que corregir una errata o añadir un idioma no afecta al consentimiento ya dado.'
    'RENDER_MODE': 'Modo de renderizado'
    'RENDER_MODE_HELP': 'Ambos cumplen la normativa por igual: un script retenido como <code>text/plain</code> nunca se ejecuta ni almacena nada. Cacheado mantiene la página idéntica para cada visitante, por lo que es seguro con una CDN o una caché de página, y una autorización surte efecto sin recargar. Dinámico mantiene los scripts bloqueados fuera del código fuente y evita el parpadeo al intercambiar los contenidos incrustados, a costa de una cabecera <code>Vary: Cookie</code>.'
    'HONOR_GPC': 'Respetar Global Privacy Control'
    'HONOR_GPC_HELP': 'Cuando el navegador envía una señal GPC, todo lo opcional se desactiva por defecto y el banner lo indica. El visitante puede seguir aceptándolo si lo desea. GPC es vinculante en varios estados de EE. UU., y respetarlo nunca es un error en el resto de los casos.'
    'EXCLUDE_ROUTES': 'Excluir estas rutas'
    'EXCLUDE_ROUTES_HELP': 'Patrones glob. No se inyecta ningún banner en una página que coincida.'
    'COOKIE_NAME': 'Nombre de la cookie'
    'COOKIE_NAME_HELP': 'Cámbialo solo si entra en conflicto con otra cosa en el sitio.'
    'COOKIE_LIFETIME': 'Volver a preguntar después de (días)'
    'COOKIE_LIFETIME_HELP': 'Cuánto tiempo se mantiene una decisión. 180 días sigue la recomendación habitual de seis meses; un año también es habitual. Elijas lo que elijas, el visitante puede cambiar de opinión en cualquier momento.'
    'COOKIE_PATH': 'Ruta de la cookie'
    'COOKIE_DOMAIN': 'Dominio de la cookie'
    'COOKIE_DOMAIN_HELP': 'Déjalo en blanco para que aplique solo a este host. Define un dominio con punto inicial para compartir una misma decisión entre subdominios.'
    'COOKIE_SAMESITE': 'SameSite'
    'GEO_MODE': 'Mostrar el banner a'
    'GEO_MODE_HELP': 'Cualquier opción distinta de Todos necesita una cabecera de país procedente de lo que sea que esté delante de Grav. Cuando no se puede determinar el país, se muestra el banner: equivocarse en el otro sentido supondría un incumplimiento normativo.'
    'GEO_HEADER': 'Cabecera de país'
    'GEO_HEADER_HELP': 'Cloudflare define <code>CF-IPCountry</code>. Otros proxies usan su propio nombre.'
    'GEO_COUNTRIES': 'Países'
    'GEO_COUNTRIES_HELP': 'Códigos de dos letras. Se usa cuando el modo anterior está fijado en una lista personalizada.'
    'LAYOUT': 'Disposición'
    'POSITION': 'Esquina'
    'POSITION_HELP': 'Solo se aplica a la disposición en caja.'
    'APPEARANCE_MODE': 'Claro u oscuro'
    'APPEARANCE_MODE_HELP': 'Automático sigue la configuración del sistema del visitante y cualquier atributo <code>data-theme</code> que tu tema añada a la página, de modo que un cambio de tema arrastra también el banner. Elige Claro u Oscuro para fijarlo, que es lo que interesa en un tema que solo ofrece uno.'
    'BLOCKING': 'Atenuar la página detrás del banner'
    'BLOCKING_HELP': 'Añade un fondo oscurecido y mantiene el foco del teclado dentro del banner. Ten en cuenta que condicionar el acceso al consentimiento es legalmente delicado en la UE, así que úsalo con moderación.'
    'SHOW_DETAILS': 'Mostrar la tabla de detalles de cookies'
    'SHOW_DETAILS_HELP': 'Enumera las cookies concretas que establece cada servicio, cuánto duran y quién las gestiona.'
    'REOPEN': 'Volver a acceder a la configuración'
    'REOPEN_HELP': 'Retirar el consentimiento debe ser tan fácil como darlo. Automático muestra una pequeña insignia en una esquina solo cuando tu tema no tiene su propio <code>{{ consent_link() }}</code>, de modo que un tema que no ha hecho nada sigue cubierto y uno que ya ha añadido un enlace en el pie de página se mantiene ordenado.'
    'FONT': 'Fuente'
