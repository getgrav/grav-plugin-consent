      'INVENTORY_HELP': 'Se genera de nuevo en cada solicitud a partir de tu propia configuración, de los plugins que se registran con este y de lo que encuentra el bloqueo automático. Nada aquí se mantiene a mano, así que no puede quedar desactualizado.'
      'AUTOBLOCK': 'Bloqueo automático'
      'AUTOBLOCK_HELP': 'Desactivado por defecto, porque reescribir tu HTML final es una solución drástica. Añade <code>data-consent-ignore</code> a cualquier elemento para excluirlo.'
      'AUTOBLOCK_INLINE': 'Bloquear también fragmentos en línea'
      'AUTOBLOCK_INLINE_HELP': 'Retiene un script en línea cuando su propio texto menciona un host de terceros conocido, lo que detecta los cargadores de Google Tag Manager y Meta Pixel que se suelen pegar, sin afectar a tu propio JavaScript.'
      'AUTOBLOCK_ALLOW': 'No bloquear nunca estos hosts'
      'AUTOBLOCK_ALLOW_HELP': 'Coincide con el host y con todo lo que esté debajo de él.'
      'CONSENT_MODE': 'Enviar señales de Consent Mode'
      'CONSENT_MODE_HELP': 'Escribe la llamada de denegación predeterminada antes de que se cargue cualquier etiqueta de Google, y la actualiza cuando el visitante toma una decisión.'
      'WAIT_FOR_UPDATE': 'Esperar una decisión (ms)'
      'WAIT_FOR_UPDATE_HELP': 'Cuánto tiempo esperan las etiquetas de Google antes de asumir la denegación. 500 es la sugerencia del propio Google.'
      'CONSENT_MODE_MAPPING': 'Categoría a señal'
      'CONSENT_MODE_MAPPING_HELP': 'Déjalo vacío para usar el mapeo estándar: analíticas a <code>analytics_storage</code>, marketing a las tres señales publicitarias, funcionales a <code>functionality_storage</code> y <code>personalization_storage</code>. Separa varias señales con comas.'
      'LOG_BACKEND': 'Mantener un registro'
      'LOG_BACKEND_HELP': 'Desactivar esto te deja sin forma de demostrar que se dio el consentimiento, que es lo que exige el artículo 7.'
      'LOG_ENDPOINT': 'Endpoint'
      'LOG_ENDPOINT_HELP': 'Dónde informa el navegador de una decisión. Es una ruta de Grav normal, así que funciona con o sin el plugin API.'
      'LOG_RETAIN': 'Conservar registros durante (días)'
      'LOG_RETAIN_HELP': 'Los archivos mensuales más antiguos se eliminan. 400 cubre el ciclo de trece meses de nuevo consentimiento con cierto margen. Pon 0 para conservarlo todo.'
      'LOG_HASH_IP': 'Aplicar hash a la dirección IP'
      'LOG_HASH_IP_HELP': 'La dirección real nunca se escribe. Aplicar hash con un salt específico del sitio es lo que convierte el registro en una prueba de que se tomó una decisión, y no en un registro de quién visitó el sitio.'
      'LOG_HASH_UA': 'Aplicar hash a la cadena del navegador'
      'LOG_ALWAYS_POST': 'Notificar decisiones aunque el registro esté desactivado'
      'LOG_ALWAYS_POST_HELP': 'Actívalo si algún plugin tuyo escucha <code>onConsentChanged</code> pero prefieres no conservar registros.'
      'INLINE_CSS': 'Insertar la hoja de estilos en línea'
      'INLINE_CSS_HELP': 'Activado por defecto. El archivo es pequeño y tenerlo en el documento hace que el banner se muestre con estilo desde el primer renderizado, en lugar de parpadear sin estilos.'
      'INLINE_JS': 'Insertar el script en línea'
      'INLINE_JS_HELP': 'Desactivado por defecto: un archivo aparte se cachea entre páginas, lo cual es la mejor opción para algo de este tamaño.'
