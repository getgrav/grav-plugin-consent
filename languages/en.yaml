# Consent plugin strings.
#
# Two blocks, same content, on purpose:
#
#   PLUGIN_CONSENT      Grav core's translator looks up the literal dotted key,
#                       so this is what the frontend banner reads.
#   ICU.PLUGIN_CONSENT  Admin Next and the API plugin check the ICU namespace
#                       first, so this is what blueprint labels resolve from.
#
# GENERATED — edit the source dict, not this file, if you are regenerating.
# Translators: copy this file to <lang>.yaml and translate the values in both
# blocks. The keys must stay identical.

'PLUGIN_CONSENT':
  'TITLE': 'Consent'
  'DESCRIPTION': 'Cookie consent with a runtime inventory other plugins register into'
  'TAB':
    'GENERAL': 'General'
    'APPEARANCE': 'Appearance'
    'CONTENT': 'Content'
    'CATEGORIES': 'Categories'
    'SERVICES': 'Services'
    'INVENTORY': 'Inventory'
    'AUTOBLOCK': 'Auto-blocking'
    'CONSENT_MODE': 'Consent Mode'
    'LOG': 'Consent log'
    'ADVANCED': 'Advanced'
  'SECTION':
    'COOKIE': 'The consent cookie'
    'GEO': 'Who gets asked'
    'TOKENS': 'Colours and type'
    'TOKENS_TEXT': 'Leave these blank and the banner inherits your theme’s font and sits on a neutral palette that works in light and dark. Anything you set here overrides the matching <code>--consent-*</code> custom property, and your theme’s own stylesheet still wins over both.'
    'CONTENT': 'Banner copy'
    'CONTENT_TEXT': 'Every field here runs through Grav’s translator. Type plain text and you get it verbatim; type a translation key such as <code>MYSITE.COOKIE_TITLE</code> and it is resolved from <code>user/languages/</code>. Leave a field alone and you get this plugin’s own translation in whatever language the visitor is reading.'
    'CATEGORIES': 'Consent categories'
    'CATEGORIES_TEXT': 'The buckets a visitor toggles. Leave this empty to use the four defaults — necessary, functional, analytics and marketing. Add rows here only if you want to rename them, reorder them, or introduce your own.'
    'SERVICES': 'Services you declare yourself'
    'SERVICES_TEXT': 'Only for things no plugin knows about — a script you pasted into your theme, say. Anything a plugin registers turns up on the Inventory tab automatically, and you never have to list it here.'
    'AUTOBLOCK': 'Auto-blocking'
    'AUTOBLOCK_TEXT': 'Finds known third-party scripts, embeds and tracking pixels in the finished page and holds them until the right category is granted. Useful when a snippet is pasted into a template and there is nothing to hook. Stripe, PayPal, reCAPTCHA and Turnstile are treated as strictly necessary, so a checkout or a captcha never breaks.'
    'CONSENT_MODE': 'Google Consent Mode v2'
    'CONSENT_MODE_TEXT': 'Tells Google’s tags what the visitor allowed. Required in practice if you run Google Ads to the EEA. The default-denied signal is written before any Google tag loads, then updated the moment the visitor decides.'
    'LOG': 'Proof of consent'
    'LOG_TEXT': 'GDPR Article 7 says you have to be able to show that consent was given. Each decision is appended to a monthly JSONL file under <code>user/data/consent/</code>. The visitor’s IP address and browser are hashed with a site-specific salt, never stored as-is.'
  'FIELD':
    'POLICY_VERSION': 'Policy version'
    'POLICY_VERSION_HELP': 'Raise this to ask everyone again — after a change to your privacy policy, for instance.'
    'AUTO_VERSION': 'Re-ask when the inventory changes'
    'AUTO_VERSION_HELP': 'Folds a hash of your category and service IDs into the version, so installing a plugin that stores something new asks everyone again on its own. Only the IDs count, so fixing a typo or adding a language leaves existing consent alone.'
    'RENDER_MODE': 'Render mode'
    'RENDER_MODE_HELP': 'Both are equally compliant — a script held as <code>text/plain</code> never runs and never stores anything. Cached keeps the page identical for every visitor, so a CDN or page cache is safe and a grant takes effect without a reload. Dynamic keeps blocked scripts out of the source and avoids the swap flicker on embeds, at the cost of a <code>Vary: Cookie</code> header.'
    'HONOR_GPC': 'Honour Global Privacy Control'
    'HONOR_GPC_HELP': 'When the browser sends a GPC signal, everything optional starts switched off and the banner says so. The visitor can still opt in. GPC is binding in several US states and honouring it is never wrong elsewhere.'
    'EXCLUDE_ROUTES': 'Skip these routes'
    'EXCLUDE_ROUTES_HELP': 'Glob patterns. No banner is injected on a matching page.'
    'COOKIE_NAME': 'Cookie name'
    'COOKIE_NAME_HELP': 'Change this only if it clashes with something else on the site.'
    'COOKIE_LIFETIME': 'Ask again after (days)'
    'COOKIE_LIFETIME_HELP': 'How long a decision stands. 180 days follows the usual six-month guidance; a year is also common. Whatever you pick, the visitor can change their mind at any time.'
    'COOKIE_PATH': 'Cookie path'
    'COOKIE_DOMAIN': 'Cookie domain'
    'COOKIE_DOMAIN_HELP': 'Leave blank for this host only. Set a leading-dot domain to share one decision across subdomains.'
    'COOKIE_SAMESITE': 'SameSite'
    'GEO_MODE': 'Show the banner to'
    'GEO_MODE_HELP': 'Automatically open the banner for everyone, the European preset, or your country list. Unknown countries always see the banner. Choose separately whether optional services run outside those countries.'
    'GEO_PROVIDER': 'Country lookup'
    'GEO_PROVIDER_HELP': 'Used for country-based prompting. Choose a trusted server header or an optional browser request to country.is. The latter shares the visitor IP with country.is before consent; no API key is needed. Everyone makes no lookup.'
    'GEO_OUTSIDE_SCOPE': 'Outside selected countries'
    'GEO_OUTSIDE_SCOPE_HELP': 'Allow optional services automatically (default), or keep them blocked until opt-in. Saved choices and Global Privacy Control take precedence over automatic allowance. No consent decision is recorded for automatic allowance.'
    'GEO_HEADER': 'Country header'
    'GEO_HEADER_HELP': 'Used by the server-header lookup only. Cloudflare sets <code>CF-IPCountry</code>. Only trust headers set or overwritten by your proxy.'
    'GEO_COUNTRIES': 'Countries'
    'GEO_COUNTRIES_HELP': 'Two-letter codes. Used when the mode above is set to a custom list.'
    'LAYOUT': 'Layout'
    'POSITION': 'Corner'
    'POSITION_HELP': 'Only applies to the box layout.'
    'APPEARANCE_MODE': 'Light or dark'
    'APPEARANCE_MODE_HELP': 'Auto follows the visitor’s system setting and any <code>data-theme</code> your theme puts on the page, so a theme toggle carries the banner with it. Pick Light or Dark to pin it — which is what you want on a theme that only ships one.'
    'BLOCKING': 'Dim the page behind the banner'
    'BLOCKING_HELP': 'Adds a backdrop and keeps keyboard focus inside the banner. Worth knowing that conditioning access on consent is legally shaky in the EU, so use this sparingly.'
    'SHOW_DETAILS': 'Show the cookie details table'
    'SHOW_DETAILS_HELP': 'Lists the individual cookies each service sets, with how long they last and who runs them.'
    'REOPEN': 'Way back to the settings'
    'REOPEN_HELP': 'Withdrawing consent has to be as easy as giving it. Auto shows a small corner badge only when your theme has no <code>{{ consent_link() }}</code> of its own, so a theme that has done nothing is still covered and one that has added a footer link stays uncluttered.'
    'FONT': 'Font'
    'FONT_HELP': 'Blank means inherit, which is almost always what you want — the banner picks up your theme’s body font on its own.'
    'COLOR_BG': 'Background'
    'COLOR_FG': 'Text'
    'COLOR_MUTED': 'Secondary text'
    'COLOR_BORDER': 'Borders'
    'COLOR_ACCENT': 'Buttons'
    'COLOR_ACCENT_FG': 'Button text'
    'RADIUS': 'Corner radius'
    'MAX_WIDTH': 'Maximum width'
    'Z_INDEX': 'Stacking order'
    'CUSTOM_CSS': 'Extra CSS'
    'CUSTOM_CSS_HELP': 'Added after the plugin’s own styles. Your theme’s stylesheet still wins over this.'
    'BANNER_TITLE': 'Heading'
    'BANNER_BODY': 'Body text'
    'LABEL_ACCEPT': 'Accept button'
    'LABEL_REJECT': 'Reject button'
    'LABEL_REJECT_HELP': 'You can rename it and you can change where it sits, but it always renders at the same weight as Accept. Making refusal harder than acceptance is exactly what the CNIL fined Google and Meta over.'
    'LABEL_PREFERENCES': 'Preferences button'
    'LABEL_SAVE': 'Save button'
    'LABEL_REOPEN': 'Reopen label'
    'PREFS_TITLE': 'Preferences heading'
    'PREFS_BODY': 'Preferences body text'
    'LINKS': 'Links'
    'LINKS_HELP': 'Shown under the banner text. Your privacy policy belongs here.'
    'LINKS_ADD': 'Add link'
    'LINK_LABEL': 'Label'
    'LINK_URL': 'URL'
    'CATEGORIES': 'Categories'
    'CATEGORIES_HELP': 'Leave empty for the four defaults.'
    'CATEGORIES_ADD': 'Add category'
    'CATEGORY_ID': 'ID'
    'CATEGORY_ID_HELP': 'Lower-case, no spaces. This is what plugins register against and what the cookie stores, so changing it asks everyone again.'
    'CATEGORY_LABEL': 'Label'
    'CATEGORY_DESCRIPTION': 'Description'
    'CATEGORY_REQUIRED': 'Always on'
    'CATEGORY_REQUIRED_HELP': 'Cannot be switched off. Use this for the one category covering things the site genuinely cannot work without.'
    'CATEGORY_DEFAULT': 'Pre-ticked'
    'CATEGORY_DEFAULT_HELP': 'Only affects how the preferences panel looks before a decision is made. Nothing loads until the visitor actually agrees.'
    'CATEGORY_PRIORITY': 'Order'
    'SERVICES': 'Services'
    'SERVICES_ADD': 'Add service'
    'SERVICE_ID': 'ID'
    'SERVICE_NAME': 'Name'
    'SERVICE_CATEGORY': 'Category'
    'SERVICE_CATEGORY_HELP': 'The ID of one of your categories.'
    'SERVICE_DESCRIPTION': 'What it does'
    'SERVICE_PROVIDER': 'Run by'
    'SERVICE_PRIVACY_URL': 'Their privacy policy'
    'SERVICE_COOKIES': 'What it stores'
    'SERVICE_COOKIES_ADD': 'Add entry'
    'COOKIE_ROW_NAME': 'Name'
    'COOKIE_ROW_DURATION': 'Lasts for'
    'COOKIE_ROW_TYPE': 'Kind'
    'INVENTORY': 'Everything this site stores'
    'INVENTORY_HELP': 'Built fresh on every request from your own config, from plugins that register with this one, and from anything auto-blocking found. Nothing here is hand-maintained, so it cannot go stale.'
    'AUTOBLOCK': 'Auto-blocking'
    'AUTOBLOCK_HELP': 'Off by default, because rewriting your finished HTML is a big hammer. Add <code>data-consent-ignore</code> to any element to skip it.'
    'AUTOBLOCK_INLINE': 'Also block inline snippets'
    'AUTOBLOCK_INLINE_HELP': 'Holds back an inline script when its own text names a known third-party host — which catches the Google Tag Manager and Meta Pixel loaders people paste in, without touching your own JavaScript.'
    'AUTOBLOCK_ALLOW': 'Never block these hosts'
    'AUTOBLOCK_ALLOW_HELP': 'Matches the host and anything under it.'
    'CONSENT_MODE': 'Send Consent Mode signals'
    'CONSENT_MODE_HELP': 'Writes the default-denied call before any Google tag loads, then updates it when the visitor decides.'
    'WAIT_FOR_UPDATE': 'Wait for a decision (ms)'
    'WAIT_FOR_UPDATE_HELP': 'How long Google’s tags hold off before assuming denial. 500 is Google’s own suggestion.'
    'CONSENT_MODE_MAPPING': 'Category to signal'
    'CONSENT_MODE_MAPPING_HELP': 'Leave empty for the standard mapping: analytics to <code>analytics_storage</code>, marketing to the three ad signals, functional to <code>functionality_storage</code> and <code>personalization_storage</code>. Separate several signals with commas.'
    'LOG_BACKEND': 'Keep a record'
    'LOG_BACKEND_HELP': 'Turning this off leaves you with no way to demonstrate consent was given, which is what Article 7 asks for.'
    'LOG_ENDPOINT': 'Endpoint'
    'LOG_ENDPOINT_HELP': 'Where the browser reports a decision. A plain Grav route, so this works with or without the API plugin.'
    'LOG_RETAIN': 'Keep records for (days)'
    'LOG_RETAIN_HELP': 'Older monthly files are deleted. 400 covers the thirteen-month re-consent cycle with a little headroom. Set 0 to keep everything.'
    'LOG_HASH_IP': 'Hash the IP address'
    'LOG_HASH_IP_HELP': 'The raw address is never written. Hashing with a site-specific salt is what makes the record evidence of a decision rather than a log of who visited.'
    'LOG_HASH_UA': 'Hash the browser string'
    'LOG_ALWAYS_POST': 'Report decisions even with the log off'
    'LOG_ALWAYS_POST_HELP': 'Turn this on if a plugin of yours listens for <code>onConsentChanged</code> but you would rather keep no records.'
    'INLINE_CSS': 'Inline the stylesheet'
    'INLINE_CSS_HELP': 'On by default. The file is small and having it in the document means the banner is styled on first paint instead of flashing unstyled.'
    'INLINE_JS': 'Inline the script'
    'INLINE_JS_HELP': 'Off by default — a separate file is cached across pages, which is the better trade for something this size.'
    'ADMIN_SIDEBAR': 'Show in the sidebar'
    'ADMIN_SIDEBAR_HELP': 'Adds a Consent entry to the admin sidebar for the decision log.'
